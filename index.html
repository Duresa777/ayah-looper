<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quran Recitation Looper</title>
    <style>
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            max-width: 600px; 
            margin: 2rem auto; 
            text-align: center; 
            background-color: #f3f4f6; 
            padding: 0 15px;
        }
        .player-container {
            background: white;
            padding: 2rem 1.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }
        h2 {
            margin-top: 0;
            color: #111827;
        }
        video { 
            width: 100%; 
            background: #000; 
            border-radius: 12px; 
            margin: 1.5rem 0; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .controls, .slicer-tools { 
            display: flex; 
            justify-content: center; 
            gap: 1rem; 
            margin-top: 1.5rem;
            flex-wrap: wrap;
        }
        button { 
            padding: 14px 24px; 
            font-size: 16px; 
            font-weight: 600;
            cursor: pointer; 
            border: none; 
            border-radius: 10px; 
            color: white; 
            transition: all 0.2s ease-in-out;
            flex: 1;
            min-width: 140px;
        }
        button:disabled { 
            background: #cbd5e1 !important; 
            cursor: not-allowed; 
            transform: none !important; 
        }
        button:active:not(:disabled) { 
            transform: scale(0.97); 
        }
        
        #prevBtn, #nextBtn { background: #2563eb; }
        #prevBtn:hover:not(:disabled), #nextBtn:hover:not(:disabled) { background: #1d4ed8; }
        
        #markCutBtn { background: #16a34a; }
        #markCutBtn:hover:not(:disabled) { background: #15803d; }
        
        #toggleLoopBtn { background: #ea580c; }
        #toggleLoopBtn:hover:not(:disabled) { background: #c2410c; }
        
        .status { 
            margin-top: 2rem; 
            padding: 1rem;
            background: #f8fafc;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500; 
            color: #475569;
        }
        ul {
            list-style: none; 
            padding: 0; 
            text-align: left; 
            margin-top: 1.5rem; 
            font-family: ui-monospace, SFMono-Regular, monospace;
        }
        li {
            padding: 12px 16px; 
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            margin-bottom: 8px;
            background: #f8fafc;
            color: #334155;
            font-size: 0.95rem;
        }
        input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 2px dashed #cbd5e1;
            border-radius: 8px;
            background: #f8fafc;
            cursor: pointer;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="player-container">
        <h2>Ayah Looper</h2>
        
        <input type="file" id="videoUpload" accept="video/mp4,video/*">
        
        <video id="quranVideo" controls playsinline></video>

        <div class="slicer-tools">
            <button id="markCutBtn">✂️ Cut Ayah Here</button>
            <button id="toggleLoopBtn">▶️ Start Looping</button>
        </div>

        <div class="controls">
            <button id="prevBtn" disabled>Previous Piece</button>
            <button id="nextBtn" disabled>Next Piece</button>
        </div>

        <div class="status" id="statusText">1. Upload a video.<br>2. Play it and click "Cut Ayah Here" to make pieces.</div>
        
        <ul id="sliceList"></ul>
    </div>

    <!-- The cache buster prevents phones from getting stuck on old code -->
    <script src="app.js?v=3"></script>
</body>
</html>
