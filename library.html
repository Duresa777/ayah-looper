<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Library - Ayah Looper</title>
    <meta name="author" content="Duresa Haji">
    <meta name="creator" content="Duresa Haji">
    <meta name="publisher" content="Ayah Looper">
    <meta name="description" content="A free tool created by Duresa Haji to cut, loop, and repeat specific Ayahs to assist with Quran memorization (Hifz).">
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <style>
        /* Shared Relaxing Light Coffee Theme */
        :root {
            --bg-color: #faf8f5;        /* Steamed milk background */
            --surface: #ffffff;         /* Pure white surface */
            --text-main: #4a3727;       /* Rich espresso text */
            --text-muted: #8a6845;      /* Milky coffee muted text */
            --border-color: #e5d5c5;    /* Vanilla syrup borders */
            
            --primary: #a3825a;         /* Caramel/Medium Roast */
            --primary-hover: #8a6845;   /* Darker Espresso hover */
            --secondary: #bfa07d;       /* Light Roast */
            --secondary-hover: #a3825a; /* Caramel hover */
            --warning: #d3ba9f;         /* Froth warning */
            --danger: #c96a6a;          /* Soft red */
        }

        /* Shared Dark Coffee Theme */
        body.dark-mode {
            --bg-color: #271c14;        /* Very dark coffee background */
            --surface: #36281d;         /* Dark roast surface */
            --text-main: #f2eae1;       /* Light cream text */
            --text-muted: #d3ba9f;      /* Caramel muted text */
            --border-color: #5c432d;    /* Coffee bean borders */
        }

        body { 
            font-family: 'Poppins', sans-serif; 
            background: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            margin: 0;
            padding: 2rem;
            box-sizing: border-box;
            transition: background 0.4s ease, color 0.4s ease;
        }

        /* Top Navigation */
        .nav-bar {
            max-width: 1200px;
            margin: 0 auto 2rem auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-btn {
            background: var(--surface);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(74, 55, 39, 0.05);
        }

        .back-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateX(-4px);
            box-shadow: 0 6px 15px rgba(74, 55, 39, 0.1);
        }

        /* Library Header & Filters */
        .library-header {
            max-width: 1200px;
            margin: 0 auto 2rem auto;
            text-align: center;
        }

        .library-header h1 {
            font-size: 2.5rem;
            margin: 0 0 0.5rem 0;
            letter-spacing: -0.5px;
            color: var(--text-main);
        }

        .library-header p {
            color: var(--text-muted);
            margin: 0 0 2rem 0;
            font-weight: 500;
        }

        .filters {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .filter-input, .reciter-dropdown {
            background: var(--surface);
            border: 2px solid var(--border-color);
            color: var(--text-main);
            padding: 14px 20px;
            border-radius: 16px;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(74, 55, 39, 0.03);
        }
        
        .filter-input {
            min-width: 250px;
            flex: 1;
            max-width: 400px;
        }

        .reciter-dropdown {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23a3825a' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 1em;
            padding-right: 2.5rem;
        }

        /* Adjust dropdown arrow color for dark mode */
        body.dark-mode .reciter-dropdown {
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23bfa07d' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
        }

        .filter-input:focus, .reciter-dropdown:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(163, 130, 90, 0.15);
        }

        /* Surah Grid */
        .surah-grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        /* Individual Surah Card */
        .surah-card {
            background: var(--surface);
            border: 2px solid var(--border-color);
            border-radius: 20px;
            padding: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(74, 55, 39, 0.04);
        }

        .surah-card:hover {
            border-color: var(--primary);
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(74, 55, 39, 0.1);
            background: var(--bg-color);
        }

        .surah-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .surah-number {
            background: var(--bg-color);
            color: var(--primary);
            font-weight: 700;
            width: 44px;
            height: 44px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            font-size: 1rem;
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }
        
        .surah-card:hover .surah-number {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .surah-names h3 {
            margin: 0;
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .surah-names p {
            margin: 0;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .play-icon {
            color: var(--primary);
            font-size: 2rem;
            opacity: 0.3;
            transition: all 0.3s ease;
        }

        .surah-card:hover .play-icon {
            opacity: 1;
            transform: scale(1.1);
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            body { padding: 1rem; }
            .nav-bar { margin-bottom: 1rem; }
            .library-header h1 { font-size: 2rem; }
            .filters { flex-direction: column; width: 100%; }
            .filter-input, .reciter-dropdown { width: 100%; max-width: 100%; box-sizing: border-box; }
        }
    </style>
</head>
<body>

    <!-- Navigation -->
    <div class="nav-bar">
        <a href="index.html" class="back-btn">
            <i class="ph ph-arrow-left"></i> Back to Player
        </a>
    </div>

    <!-- Header & Search -->
    <div class="library-header">
        <h1>Quran Audio Library</h1>
        <p>Select a reciter and Surah to instantly load it into Ayah Looper.</p>
        
        <div class="filters">
            <select id="reciterSelect" class="reciter-dropdown">
                <option value="mishaari_raashid_al_3afaasee">Mishary Rashid Alafasy</option>
                <option value="muhammad_siddeeq_al-minshaawee">Mohamed Siddiq al-Minshawi</option>
                <option value="mahmood_khaleel_al-husaree">Mahmoud Khalil Al-Husary</option>
            </select>
            
            <input type="text" class="filter-input" id="searchInput" placeholder="Search for a Surah...">
        </div>
    </div>

    <!-- Grid of Audio Files -->
    <div class="surah-grid" id="surahGrid">
        <!-- Javascript will inject the beautifully styled cards here automatically -->
    </div>

    <script>
        const surahGrid = document.getElementById('surahGrid');
        const searchInput = document.getElementById('searchInput');
        const reciterSelect = document.getElementById('reciterSelect');

        // Fetch all 114 Surahs from the free Alquran API
        async function loadSurahs() {
            try {
                surahGrid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color: var(--text-muted); font-weight: 500;">Loading library...</p>';
                
                const response = await fetch('https://api.alquran.cloud/v1/surah');
                const data = await response.json();
                const surahs = data.data;

                surahGrid.innerHTML = '';

                surahs.forEach(surah => {
                    const card = document.createElement('div');
                    card.className = 'surah-card';
                    card.innerHTML = `
                        <div class="surah-info">
                            <div class="surah-number">${surah.number}</div>
                            <div class="surah-names">
                                <h3>${surah.englishName}</h3>
                                <p>${surah.englishNameTranslation}</p>
                            </div>
                        </div>
                        <i class="ph-fill ph-play-circle play-icon"></i>
                    `;

                    card.addEventListener('click', () => {
                        const reciterValue = reciterSelect.value;
                        const reciterName = reciterSelect.options[reciterSelect.selectedIndex].text;
                        const paddedNumber = String(surah.number).padStart(3, '0');
                        const audioUrl = `https://download.quranicaudio.com/quran/${reciterValue}/${paddedNumber}.mp3`;
                        
                        window.location.href = `index.html?audio=${encodeURIComponent(audioUrl)}&title=${encodeURIComponent(surah.englishName)}&reciter=${encodeURIComponent(reciterName)}`;
                    });

                    surahGrid.appendChild(card);
                });

                searchInput.addEventListener('input', (e) => {
                    const term = e.target.value.toLowerCase();
                    const cards = document.querySelectorAll('.surah-card');
                    
                    cards.forEach((c, index) => {
                        const name = surahs[index].englishName.toLowerCase();
                        const translation = surahs[index].englishNameTranslation.toLowerCase();
                        
                        if (name.includes(term) || translation.includes(term)) {
                            c.style.display = 'flex';
                        } else {
                            c.style.display = 'none';
                        }
                    });
                });

            } catch (error) {
                console.error("Error loading Surahs:", error);
                surahGrid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color: var(--danger);">Error loading library. Please check your internet connection.</p>';
            }
        }

        loadSurahs();
        
        // Inherit Dark Mode from the main app automatically
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
        }
    </script>
</body>
</html>
